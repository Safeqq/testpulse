name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (never cancel a run on main: it may be mid-publish).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint-typecheck:
    name: Lint, typecheck, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Dependency audit (fails on high or critical)
        run: pnpm audit --audit-level high

  unit:
    name: Unit tests and coverage gate
    needs: lint-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALLURE_JOB: unit
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Shared unit tests
        run: >-
          pnpm --filter @testpulse/shared exec vitest run
          --reporter=default --reporter=junit --outputFile.junit=allure-results/junit-shared-unit.xml
      - name: API unit tests (domain coverage gate is 80%)
        run: pnpm --filter @testpulse/api exec vitest run --project unit --coverage
      - name: Web unit tests (Pages Function proxy, security header parity)
        run: pnpm --filter @testpulse/web test:unit
      - name: Reporter CLI unit tests (merge, upload, exit codes)
        run: pnpm --filter @testpulse/reporter test:unit
      - name: ZAP report gate tests
        run: pnpm --filter @testpulse/tests test:security
      - uses: ./.github/actions/upload-allure
        if: ${{ !cancelled() }}
        with:
          name: unit
          paths: apps/api/allure-results packages/shared/allure-results packages/reporter/allure-results apps/web/allure-results

  integration:
    name: Integration tests (Testcontainers)
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALLURE_JOB: integration
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Integration tests
        run: pnpm --filter @testpulse/api test:int
      - uses: ./.github/actions/upload-allure
        if: ${{ !cancelled() }}
        with:
          name: integration
          paths: apps/api/allure-results

  contract:
    name: Contract tests (Pact consumer, then provider)
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALLURE_JOB: contract
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Consumers (web, reporter) write pacts/, the provider verifies both: all must run in this same job.
      - name: Contract tests
        run: pnpm test:contract
      - uses: ./.github/actions/upload-allure
        if: ${{ !cancelled() }}
        with:
          name: contract
          paths: apps/web/allure-results packages/reporter/allure-results apps/api/allure-results

  stack-tests:
    name: Stack tests (API + E2E) shard ${{ matrix.shard }}
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    env:
      BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Start stack (docker compose)
        run: docker compose up -d --build --wait

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # The Ubuntu apt mirror on hosted runners occasionally stalls mid-download. Make apt retry slow connections itself,
      # then bound each install attempt and retry, so one stalled download no longer fails the whole job.
      - name: Configure apt retries
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null
      - name: Install Playwright browsers
        timeout-minutes: 14
        run: |
          for attempt in 1 2 3; do
            if timeout 240 pnpm --filter @testpulse/tests exec playwright install --with-deps chromium firefox webkit; then
              exit 0
            fi
            echo "::warning::Playwright install attempt ${attempt} failed or timed out; retrying"
            sudo pkill -f apt-get || true
            sudo dpkg --configure -a || true
            sleep 10
          done
          exit 1

      # API tests do not depend on the browser, so they run once (shard 1 only).
      - name: API tests
        if: ${{ matrix.shard == '1/3' }}
        working-directory: tests
        run: pnpm exec playwright test --project api --workers=2

      - name: E2E tests (all browsers, includes axe)
        working-directory: tests
        run: pnpm exec playwright test --project "e2e-*" --shard=${{ matrix.shard }} --workers=2

      - uses: ./.github/actions/upload-allure
        if: ${{ !cancelled() }}
        with:
          name: stack-${{ strategy.job-index }}
          paths: tests/allure-results

      - name: Upload Playwright report and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: |
            tests/playwright-report
            tests/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Stack logs
        if: ${{ failure() }}
        run: docker compose logs --no-color --tail=200

  zap:
    name: ZAP baseline scan
    needs: stack-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          build-shared: "false"

      - name: Start stack (docker compose)
        run: docker compose up -d --build --wait

      # Runs on the compose network (testpulse_default) and targets the web service by name.
      # zap-baseline.py -I: warnings do not fail the scan; the High-risk gate is check-zap-report.mjs.
      - name: ZAP baseline
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network testpulse_default \
            -v "$PWD/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://web:8080 -J report.json -r report.html -I

      - name: Fail on High-risk alerts
        run: node tests/security/check-zap-report.mjs zap/report.json

      - name: Upload ZAP report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap
          if-no-files-found: ignore
          retention-days: 7

      - name: Stack logs
        if: ${{ failure() }}
        run: docker compose logs --no-color --tail=200

  report:
    name: Allure report
    needs: [unit, integration, contract, stack-tests, zap]
    # Build the report even when an earlier job failed: that is when it is most useful.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          build-shared: "false"

      - name: Download all Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results

      - name: Generate Allure report
        run: |
          if [ ! -d allure-results ] || [ -z "$(ls -A allure-results)" ]; then
            echo "No Allure results were produced by earlier jobs." >&2
            exit 1
          fi
          pnpm exec allure generate allure-results -o allure-report

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 14

      - name: Upload Pages artifact
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report
          # Unique per attempt: re-running a run would otherwise leave two "github-pages" artifacts and deploy-pages fails.
          name: github-pages-${{ github.run_attempt }}

  publish-report:
    name: Publish report to GitHub Pages
    needs: report
    if: ${{ !cancelled() && needs.report.result == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
