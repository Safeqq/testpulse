name: Deploy

# Order (spec section 10): Render deploy hook -> wait until the NEW API revision serves traffic -> deploy web -> final
# health check through the Pages Function -> smoke test. Runs after the CI workflow finishes on main. The workflow file itself always comes from the default branch.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Manual re-run (for example after fixing a secret): deploys the selected ref without waiting for CI.
  workflow_dispatch:

permissions:
  contents: read

# One production deploy at a time; a newer one queues behind the running one instead of cancelling it mid-flight.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy API and web, then smoke test
    # workflow_run also fires for pull_request runs whose head branch is named "main" (forks); only push runs deploy.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # actions: read lets the dogfooding step download the artifacts of the CI run that triggered this deploy.
    permissions:
      contents: read
      actions: read
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
    steps:
      - name: Check required secrets
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_URL: ${{ secrets.RENDER_API_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          SMOKE_PUBLIC_SLUG: ${{ secrets.SMOKE_PUBLIC_SLUG }}
        run: |
          missing=0
          for name in RENDER_DEPLOY_HOOK_URL RENDER_API_URL CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PRODUCTION_URL SMOKE_EMAIL SMOKE_PASSWORD SMOKE_PUBLIC_SLUG; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub secret $name is not set (see docs/deploy.md)"
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: ./.github/actions/setup

      # Render builds the exact commit that passed CI (autoDeploy is off in render.yaml).
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          separator='&'
          case "$RENDER_DEPLOY_HOOK_URL" in *\?*) ;; *) separator='?' ;; esac
          curl -fsS --max-time 60 -X POST -o /dev/null "${RENDER_DEPLOY_HOOK_URL}${separator}ref=${DEPLOY_SHA}"
          echo "Render deploy triggered for ${DEPLOY_SHA}"

      # Built while Render is still building; nothing is deployed to Pages until the new API revision is live.
      - name: Build web
        run: pnpm --filter @testpulse/web build

      # Render keeps serving the previous instance until the new one is healthy, so a plain 200 would also pass against
      # the old revision. /api/health reports the running commit (RENDER_GIT_COMMIT); wait until it is this deploy's SHA.
      # Polls the Render origin directly: the Pages Function in front of it may not exist yet on the very first deploy.
      # Render free instances cold start and a new image takes minutes to build: every 15 s for up to 10 min.
      - name: Wait for the new API revision
        env:
          RENDER_API_URL: ${{ secrets.RENDER_API_URL }}
        run: bash .github/scripts/wait-for-health.sh "${RENDER_API_URL%/}/api/health" "$DEPLOY_SHA" 600 15

      # The Pages Function (apps/web/functions) is bundled by wrangler from the working directory, hence apps/web.
      # --branch main: the checkout is a detached HEAD, which would otherwise create a preview deployment.

      - name: Deploy web to Cloudflare Pages
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes wrangler@4 pages deploy dist --project-name testpulse --branch main --commit-hash "$DEPLOY_SHA" --commit-dirty=true

      # Goes through the Pages Function, so this also proves the proxy, API_ORIGIN (it must point at the service that
      # runs this commit) and the Neon connection. The new Pages deployment may need a few seconds to propagate.
      - name: Verify production through the Pages Function
        run: bash .github/scripts/wait-for-health.sh "${PRODUCTION_URL%/}/api/health" "$DEPLOY_SHA" 300 10

      - name: Install Playwright (chromium only)
        run: pnpm --filter @testpulse/tests exec playwright install --with-deps chromium

      - name: Smoke test
        working-directory: tests
        env:
          BASE_URL: ${{ secrets.PRODUCTION_URL }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          SMOKE_PUBLIC_SLUG: ${{ secrets.SMOKE_PUBLIC_SLUG }}
        run: pnpm exec playwright test --project smoke

      # Dogfooding (spec Tahap 2 section 10): after the smoke test passed, the JUnit reports of the CI run that triggered
      # this deploy are uploaded to the public production project "testpulse". It never fails the deploy: the secret is
      # optional (see docs/deploy.md) and every dogfooding step has continue-on-error. The token only ever reaches the
      # reporter through the environment; it is not part of the required-secrets check above.
      - name: Check dogfooding prerequisites
        id: dogfood
        env:
          TESTPULSE_TOKEN: ${{ secrets.TESTPULSE_TOKEN }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ -z "$TESTPULSE_TOKEN" ]; then
            echo "::warning::GitHub secret TESTPULSE_TOKEN is not set; skipping the upload of CI results to TestPulse (see docs/deploy.md)"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$CI_RUN_ID" ]; then
            echo "::warning::No triggering CI run (manual dispatch); skipping the upload of CI results to TestPulse"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download CI test results
        id: dogfood-download
        if: ${{ steps.dogfood.outputs.enabled == 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: ci-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Warn when CI test results could not be downloaded
        if: ${{ steps.dogfood-download.outcome == 'failure' }}
        run: echo "::warning::Could not download the artifacts of the triggering CI run (expired after 7 days, or missing); skipping the upload of CI results to TestPulse"

      # Only the JUnit XML files go up (junit-*.xml); the rest of allure-results is Allure's own JSON.
      - name: Upload CI test results to TestPulse
        if: ${{ steps.dogfood.outputs.enabled == 'true' && steps.dogfood-download.outcome == 'success' }}
        continue-on-error: true
        env:
          TESTPULSE_TOKEN: ${{ secrets.TESTPULSE_TOKEN }}
          CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
          CI_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          run_name="CI #${CI_RUN_NUMBER}"
          if [ "${CI_RUN_ATTEMPT:-1}" -gt 1 ]; then run_name="${run_name} (attempt ${CI_RUN_ATTEMPT})"; fi
          {
            pnpm --filter @testpulse/reporter build &&
            node packages/reporter/dist/cli.js \
              --url "$PRODUCTION_URL" \
              --project testpulse \
              --branch main \
              --commit "$DEPLOY_SHA" \
              --ci-url "$CI_RUN_URL" \
              --name "$run_name" \
              'ci-results/junit-*.xml'
          } || { code=$?; echo "::warning::Building the reporter or uploading CI results to TestPulse failed (exit code ${code}); the deploy itself is unaffected"; exit "$code"; }

      - name: Upload Playwright report and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: smoke-report
          path: |
            tests/playwright-report
            tests/test-results
          if-no-files-found: ignore
          retention-days: 7
