server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # The API owns the /api prefix itself, so the path is forwarded without rewriting.
    # API responses carry their own (helmet) headers, so the SPA snippet is not included here.
    location /api/ {
        # JUnit uploads may be up to 5 MB (the API enforces the exact limit and answers 413 PAYLOAD_TOO_LARGE);
        # the slack keeps nginx from replacing that JSON error with its own HTML 413 for bodies just over 5 MB.
        client_max_body_size 6m;
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Container healthcheck (does not depend on the API being up).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Fingerprinted Vite assets: cache for a year. A missing asset must 404, not fall back to index.html.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html and any other static file; unknown paths get the SPA shell.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
