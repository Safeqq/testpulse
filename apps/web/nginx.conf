# Sama dengan proxy di vite.config.ts: browser hanya berbicara ke satu origin.
server {
  listen 8080;
  root /usr/share/nginx/html;

  location /api/catalog/ {
    proxy_pass http://catalog:3001/;
  }

  location /api/order/ {
    proxy_pass http://order:3002/;
  }

  # SPA fallback agar refresh di /checkout dsb. tetap memuat index.html
  location / {
    try_files $uri /index.html;
  }
}
