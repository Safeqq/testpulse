# Security headers for SPA/static responses (ruling R4).
# Keep values identical to the Cloudflare Pages `_headers` file (Task 15).
# nginx drops inherited add_header directives in any location that declares its own,
# so this snippet is included in every location that serves web content.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
