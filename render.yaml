# Render Blueprint for the TestPulse API (Docker, free plan). Step-by-step setup: docs/deploy.md.
# Migrations run automatically when the API starts (apps/api/src/server.ts).
services:
  - type: web
    name: testpulse-api
    runtime: docker
    plan: free
    # Region cannot be changed after creation. Pick the Neon region closest to it (docs/deploy.md).
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    # Deploys are triggered by the Render deploy hook from .github/workflows/deploy.yml after CI is green.
    autoDeployTrigger: "off"
    envVars:
      # Neon connection string, set in the Render dashboard when the Blueprint is created.
      - key: DATABASE_URL
        sync: false
      # Public origin of the web app (Cloudflare Pages), e.g. https://testpulse.pages.dev (no trailing slash).
      - key: APP_ORIGIN
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      # Shared secret with the Cloudflare Pages Function (same value there, as an encrypted variable).
      # Only requests carrying it are rate-limited by the client IP from the x-tp-client-ip header; everything else is
      # keyed by the direct peer, so calling the Render URL directly with forged headers cannot evade the limit.
      # See docs/deploy.md. (RENDER_GIT_COMMIT is set by Render itself and is reported by /api/health.)
      - key: PROXY_SECRET
        sync: false
      # RATE_LIMIT_MAX is intentionally unset: production uses the default of 10 per minute per IP.
